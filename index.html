<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f9d55">
<title>JAIHUN MARKET</title>
<link rel="icon" href="oo.jpg" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="oo.jpg">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JAIHUN MARKET">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@800&display=swap" rel="stylesheet">
<style>
:root{--primary:#1f9d55;--primary-light:#27b365;--bg-body:#F3F6F3;--bg-card:#fff;--text-main:#12201a;--text-muted:#6B7280;--border:#E2EAE4;--danger:#e5484d;--danger-bg:#FEE2E2;--shadow:0 4px 6px -1px rgba(18,50,30,.05),0 2px 4px -1px rgba(18,50,30,.03);--radius:20px;--radius-sm:12px;--nav-height:68px;--header-height:122px}
[data-theme=dark]{--bg-body:#0f1712;--bg-card:#1a241e;--text-main:#e2eae4;--text-muted:#8d9c93;--border:#2a3b30;--danger-bg:#7F1D1D;--shadow:0 4px 6px -1px rgba(0,0,0,.3)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:'Manrope',sans-serif}
body{background:var(--bg-body);color:var(--text-main);overflow:hidden;transition:background .3s,color .3s}
button{font-family:inherit}
#app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg-body);position:relative;display:flex;flex-direction:column;box-shadow:0 0 20px rgba(0,0,0,.1);overflow:hidden}
header{background:var(--bg-card);padding:10px 16px 12px;position:fixed;top:0;width:100%;max-width:480px;z-index:100;border-bottom:1px solid var(--border)}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo-container{display:flex;align-items:center;gap:7px;cursor:pointer}
.logo-img{width:32px;height:32px;border-radius:9px;object-fit:cover;box-shadow:0 2px 6px rgba(31,157,85,.25)}
.logo-text{font-family:'Sora','Manrope',sans-serif;font-weight:800;font-size:13px;letter-spacing:-.02em;line-height:1;text-transform:uppercase;background:linear-gradient(90deg,#0d5e33,#27b365);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.logo-text span{display:block;font-family:'Manrope',sans-serif;font-size:7px;font-weight:800;letter-spacing:.16em;margin-top:4px;-webkit-text-fill-color:var(--text-muted);color:var(--text-muted)}
[data-theme=dark] .logo-text{background:linear-gradient(90deg,#3ddc84,#9af0c0);-webkit-background-clip:text;background-clip:text}
.header-actions{display:flex;gap:6px;align-items:center}
.icon-btn{background:none;border:none;color:var(--text-main);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%}
.icon-btn:active{background:var(--border);transform:scale(.95)}
.icon-btn svg{width:20px;height:20px}
.lang-btn{background:var(--bg-body);border:1px solid var(--border);color:var(--primary);font-size:11px;font-weight:800;padding:5px 8px;border-radius:8px;cursor:pointer}
.badge{position:absolute;top:-2px;right:-2px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;border:2px solid var(--bg-card);padding:0 3px}
.search-bar{display:flex;align-items:center;background:var(--bg-body);border-radius:var(--radius-sm);padding:8px 12px;gap:8px;border:1px solid var(--border)}
.search-bar input{border:none;background:transparent;flex:1;color:var(--text-main);font-size:14px;outline:none;min-width:0}
.search-bar>svg{color:var(--text-muted);width:20px;height:20px}
#s-clear{display:none;border:0;background:var(--border);color:var(--text-muted);width:20px;height:20px;border-radius:50%;font-size:14px;line-height:1;cursor:pointer}
main{flex:1;overflow-y:auto;padding-top:var(--header-height);padding-bottom:calc(var(--nav-height) + 84px);scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.page{display:none;padding:16px;animation:fadeIn .3s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}
.section-title h2{font-size:18px;font-weight:800}
.section-title a{font-size:13px;color:var(--primary);font-weight:700;cursor:pointer;text-decoration:none}
.banner-slider{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.banner-slider::-webkit-scrollbar{display:none}
.banner{min-width:100%;scroll-snap-align:start;height:140px;border-radius:var(--radius);background:linear-gradient(135deg,var(--primary),var(--primary-light));display:flex;flex-direction:column;justify-content:center;padding:20px;color:#fff;position:relative;overflow:hidden}
.banner:nth-child(2){background:linear-gradient(135deg,#14783f,#1f9d55)}
.banner h3{font-size:20px;margin-bottom:8px;z-index:2;font-weight:800}
.banner p{font-size:13px;opacity:.9;z-index:2;font-weight:600}
.banner::after{content:'';position:absolute;right:-20px;bottom:-20px;width:120px;height:120px;background:rgba(255,255,255,.15);border-radius:50%}
.categories-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.category-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.category-item:active{transform:scale(.95)}
.category-icon{width:56px;height:56px;background:var(--bg-card);border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);font-size:24px}
.category-item span{font-size:11px;text-align:center;font-weight:700}
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.product-card{background:var(--bg-card);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);position:relative;display:flex;flex-direction:column;cursor:pointer}
.product-card:active{transform:scale(.98)}
.product-img-container{width:100%;height:120px;border-radius:var(--radius-sm);background:var(--bg-body);display:flex;align-items:center;justify-content:center;margin-bottom:8px;overflow:hidden}
.product-img{width:100%;height:100%;object-fit:cover}
.product-img.emoji{font-size:50px;display:flex;align-items:center;justify-content:center}
.fav-btn{position:absolute;top:18px;right:18px;background:var(--bg-card);border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.1);color:var(--text-muted);z-index:2}
.fav-btn.active{color:var(--danger)}
.fav-btn svg{width:16px;height:16px}
.disc-badge{position:absolute;top:8px;left:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;z-index:2}
.product-price{font-weight:800;font-size:15px;color:var(--primary);margin-top:4px}
.product-price s{font-size:12px;color:var(--text-muted);margin-left:4px;font-weight:600}
.product-name{font-size:13px;font-weight:700;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:36px;line-height:1.3}
.product-dosage{font-size:11px;color:var(--text-muted);margin-bottom:8px;font-weight:600}
.card-act{margin-top:auto}
.add-btn{background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);padding:9px;font-size:13px;font-weight:700;cursor:pointer;width:100%}
.add-btn:active{background:var(--primary-light);transform:scale(.96)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--primary);color:#fff;border-radius:var(--radius-sm);padding:3px}
.stepper button{width:34px;height:30px;border:0;border-radius:9px;background:rgba(255,255,255,.2);color:#fff;font-size:18px;font-weight:800;cursor:pointer}
.stepper b{font-size:14px}
.catalog-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.catalog-tabs::-webkit-scrollbar{display:none}
.tab-btn{white-space:nowrap;background:var(--bg-card);border:1px solid var(--border);color:var(--text-main);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer}
.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.filter-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;font-weight:600;color:var(--text-muted)}
#sort-sel{border:1px solid var(--border);background:var(--bg-card);color:var(--text-main);border-radius:10px;padding:6px 8px;font-size:12px;font-weight:700;outline:none}
.empty-msg{grid-column:span 2;text-align:center;color:var(--text-muted);padding:30px;font-weight:700}
.detail-img{width:100%;height:250px;object-fit:cover;background:var(--bg-card);border-radius:var(--radius);margin-bottom:16px;display:flex;align-items:center;justify-content:center;font-size:100px}
.detail-title{font-size:22px;font-weight:800;margin-bottom:4px}
.detail-sub{font-size:13px;color:var(--text-muted);margin-bottom:12px;font-weight:600}
.detail-price-row{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.detail-price{font-size:24px;font-weight:800;color:var(--primary)}
.detail-price-row s{font-size:16px;color:var(--text-muted);font-weight:600}
.stock-info{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--primary);margin-bottom:18px;font-weight:700}
.detail-actions{display:flex;gap:10px;margin-bottom:8px}
.detail-actions .card-act{flex:1}
.detail-actions .add-btn,.detail-actions .stepper{height:48px;font-size:15px}
.detail-actions .stepper button{height:40px}
.detail-actions .icon-btn{width:48px;height:48px;border-radius:14px;background:var(--bg-card);border:1px solid var(--border)}
.dfav.active{color:var(--danger)}
.cart-item{display:flex;gap:12px;background:var(--bg-card);padding:12px;border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow)}
.cart-item-img{width:60px;height:60px;object-fit:cover;border-radius:var(--radius-sm);background:var(--bg-body);display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
.cart-item-info{flex:1}
.cart-item-title{font-size:14px;font-weight:700;margin-bottom:4px}
.cart-item-price{font-size:15px;font-weight:800;color:var(--primary)}
.cart-item-actions{display:flex;align-items:center;gap:12px;margin-top:8px}
.qty-control{display:flex;align-items:center;background:var(--bg-body);border-radius:20px;padding:2px}
.qty-btn{width:28px;height:28px;border-radius:50%;border:none;background:var(--bg-card);color:var(--text-main);font-size:18px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.qty-val{width:30px;text-align:center;font-size:14px;font-weight:700}
.remove-btn{background:none;border:none;color:var(--danger);cursor:pointer;margin-left:auto}
.remove-btn svg{width:18px;height:18px}
#free-bar{background:var(--bg-card);border-radius:var(--radius-sm);padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
.fb-t{font-size:13px;font-weight:700;margin-bottom:8px}.fb-t.ok{color:var(--primary)}
.fb-track{height:6px;background:var(--border);border-radius:6px;overflow:hidden}
.fb-track i{display:block;height:100%;background:var(--primary);border-radius:6px;transition:width .4s}
.cart-summary{background:var(--bg-card);padding:16px;border-radius:var(--radius);margin-top:16px;box-shadow:var(--shadow)}
.summary-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px;font-weight:600;color:var(--text-muted)}
.summary-row.total{font-size:18px;font-weight:800;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);color:var(--primary)}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px;font-weight:700}
.form-group input{width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text-main);font-size:14px;font-weight:600;outline:none}
.form-group input:focus{border-color:var(--primary)}
.checkout-buttons{display:flex;gap:10px;margin-top:16px}
.btn-checkout{flex:1;padding:14px;border-radius:var(--radius-sm);font-size:15px;font-weight:800;color:#fff;border:none;cursor:pointer}
.btn-wa{background:#25D366}.btn-tg{background:#0088cc}
.empty-state{display:flex;flex-direction:column;align-items:center;padding:40px 20px;text-align:center}
.empty-state .big{font-size:64px;margin-bottom:12px}
.empty-state h3{font-size:18px;margin-bottom:8px;font-weight:800}
.empty-state p{font-size:14px;color:var(--text-muted);margin-bottom:20px;font-weight:600}
.empty-state button{background:var(--primary);color:#fff;border:none;padding:10px 24px;border-radius:20px;font-weight:700;cursor:pointer}
.profile-header{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-top:10px}
.avatar-container{position:relative;cursor:pointer}
.avatar{width:70px;height:70px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:800;box-shadow:0 4px 10px rgba(31,157,85,.3);overflow:hidden;border:2px solid var(--bg-card)}
.avatar img{width:100%;height:100%;object-fit:cover}
.edit-avatar-icon{position:absolute;bottom:0;right:0;background:var(--bg-card);border:1px solid var(--border);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.profile-info{flex:1;cursor:pointer}
.profile-info h3{font-size:18px;margin-bottom:4px;font-weight:800}
.profile-info p{font-size:13px;color:var(--text-muted);font-weight:600}
.menu-list{background:var(--bg-card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
.menu-item{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.menu-item:last-child{border-bottom:none}
.menu-item:active{background:var(--bg-body)}
.menu-icon{width:36px;height:36px;border-radius:10px;background:var(--bg-body);display:flex;align-items:center;justify-content:center;margin-right:14px;font-size:18px}
.menu-text{flex:1;font-size:15px;font-weight:700}
.menu-arrow{color:var(--text-muted);font-weight:800}
.switch{position:relative;display:inline-block;width:44px;height:24px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#ccc;transition:.4s;border-radius:24px}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;transition:.4s;border-radius:50%}
input:checked+.slider{background:var(--primary)}
input:checked+.slider:before{transform:translateX(20px)}
nav.bottom-nav{position:fixed;bottom:0;width:100%;max-width:480px;height:calc(var(--nav-height) + env(safe-area-inset-bottom));background:var(--bg-card);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-muted);font-size:10px;font-weight:700;cursor:pointer;width:20%;position:relative}
.nav-item svg{width:24px;height:24px}
.nav-item.active{color:var(--primary)}
.nav-badge{position:absolute;top:-4px;right:22%;background:var(--danger);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 4px}
#cart-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-height) + 10px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:456px;background:linear-gradient(90deg,#14783f,#1f9d55);color:#fff;border-radius:16px;padding:12px 16px;display:none;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;z-index:90;box-shadow:0 8px 20px rgba(31,157,85,.35);cursor:pointer}
#to-top{position:fixed;right:14px;bottom:calc(var(--nav-height) + 80px);width:40px;height:40px;border-radius:50%;border:0;background:var(--bg-card);color:var(--primary);box-shadow:0 4px 12px rgba(0,0,0,.18);font-size:18px;font-weight:800;display:none;z-index:90;cursor:pointer}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.active{opacity:1;pointer-events:all}
.modal-content{background:var(--bg-card);width:90%;max-width:340px;border-radius:var(--radius);padding:24px;text-align:center;transform:scale(.9);transition:transform .3s}
.modal-overlay.active .modal-content{transform:scale(1)}
.modal-title{font-size:18px;font-weight:800;margin-bottom:12px}
.modal-text{font-size:14px;color:var(--text-muted);margin-bottom:20px;line-height:1.5;max-height:50vh;overflow-y:auto}
.modal-input{width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-body);color:var(--text-main);font-size:15px;font-weight:600;margin-bottom:16px;outline:none}
.modal-actions{display:flex;gap:10px}
.modal-btn{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;border:none}
.modal-btn.primary{background:var(--primary);color:#fff}
.modal-btn.secondary{background:var(--bg-body);color:var(--text-main)}
.order-row{text-align:left;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-main)}
.order-row b{color:var(--primary)}
.toast{z-index:6000!important;position:fixed;bottom:150px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text-main);color:var(--bg-body);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;transition:all .3s;z-index:2500;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast.show{opacity:1;transform:translateX(-50%)}
.skeleton{background:linear-gradient(90deg,var(--border) 25%,var(--bg-card) 50%,var(--border) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;height:220px;border-radius:var(--radius)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.hidden{display:none!important}
#splash{position:fixed;inset:0;z-index:5000;background:linear-gradient(160deg,#0d5e33,#1f9d55 60%,#27b365);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}
.sp-logo{width:92px;height:92px;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:pop .8s ease both}
.sp-logo img{width:100%;height:100%;object-fit:cover}
.sp-name{font-family:'Sora','Manrope',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em;margin-top:22px;animation:fadeIn .8s .2s ease both}
.sp-sub{font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;opacity:.75;margin-top:8px;animation:fadeIn .8s .3s ease both}
.sp-bar{width:140px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);margin-top:34px;overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:#fff;border-radius:4px;animation:load 1.7s ease-in-out forwards}
@keyframes load{to{width:100%}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#welcome{position:fixed;inset:0;z-index:4000;background:var(--bg-body);display:none;overflow-y:auto}
#welcome.show{display:block;animation:fadeIn .4s ease}
.w-wrap{max-width:480px;margin:0 auto;min-height:100%;padding:28px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center}
.w-top{display:flex;justify-content:flex-end;margin-bottom:10px}
.w-ico{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--primary-light));display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:16px;box-shadow:0 8px 20px rgba(31,157,85,.3)}
.w-wrap h1{font-size:24px;font-weight:800;margin-bottom:6px}
.w-wrap>p{font-size:14px;color:var(--text-muted);font-weight:600;margin-bottom:22px;line-height:1.4}
#w-err{min-height:18px;color:var(--danger);font-size:13px;font-weight:700;margin:2px 0 10px}
.w-btn{width:100%;padding:15px;border:0;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(31,157,85,.3)}
.w-btn:active{transform:scale(.98)}
#banner-slider{padding-bottom:0}
.banner{height:160px;background-color:var(--primary);background-size:cover;background-position:center;cursor:pointer}
.banner.has-img{padding:18px 20px;justify-content:flex-end}
.banner.has-img::after{display:none}
.banner.has-img h3,.banner.has-img p{text-shadow:0 1px 6px rgba(0,0,0,.5)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}

const PRODUCTS=RAW.map((r,i)=>({id:'p'+(i+1),cat:r[0],emoji:r[1],img:img(r[2]),tg:r[3],ru:r[4],en:r[5],w:r[6],price:r[7],old:r[8]||0}));
const byId=id=>PRODUCTS.find(p=>p.id===id);

let state={cart:load(LS.cart,{}),favs:load(LS.favs,[]),theme:localStorage.getItem(LS.theme)||'light',lang:localStorage.getItem(LS.lang)||'tg',profile:load(LS.profile,{name:'',phone:'',address:'',avatar:''}),page:'home',cat:'all',q:''};
let sortBy='def',fromPop=false;
const D=()=>I18N[state.lang];
const t=k=>D()[k]||k;
const count=()=>Object.values(state.cart).reduce((a,b)=>a+b,0);
const subtotal=()=>Object.entries(state.cart).reduce((s,[id,q])=>{const p=byId(id);return s+(p?p.price*q:0)},0);
const fee=s=>s>=FREE?0:FEE;

/* ---------- init ---------- */
document.addEventListener('DOMContentLoaded',()=>{
  history.replaceState({p:'home'},'');
  document.documentElement.setAttribute('data-theme',state.theme);
  $('theme-switch').checked=state.theme==='dark';$('theme-btn').textContent=state.theme==='dark'?'☀️':'🌙';
  $('phone-input').addEventListener('input',maskPhone);
  $('w-phone').addEventListener('input',maskPhone);
  ['w-name','w-phone','w-addr'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')submitWelcome()}));
  document.querySelector('main').addEventListener('scroll',e=>{$('to-top').style.display=e.target.scrollTop>400?'block':'none'});
  window.addEventListener('popstate',e=>{fromPop=true;go((e.state&&e.state.p)||'home');fromPop=false});
  applyLang();
  initBannerSlider();
  $('popular-products').innerHTML='<div class="skeleton"></div><div class="skeleton"></div>';
  setTimeout(renderHome,500);
  if(state.profile.phone)localStorage.setItem(LS.onb,'1');
  setTimeout(()=>{
    const sp=$('splash');sp.classList.add('hide');setTimeout(()=>sp.remove(),600);
    if(!localStorage.getItem(LS.onb)){$('welcome').classList.add('show');setTimeout(()=>$('w-name').focus(),400)}
  },Math.max(0,1800-(Date.now()-START)));
});

function submitWelcome(){
  const n=$('w-name').value.trim(),p=$('w-phone').value.trim(),a=$('w-addr').value.trim(),e=$('w-err');
  const bad=m=>{e.textContent=m};
  if(n.length<2)return bad(t('reqName'));
  if(p.replace(/\D/g,'').length<12)return bad(t('badPhone'));
  if(a.length<3)return bad(t('reqAddr'));
  Object.assign(state.profile,{name:n,phone:p,address:a});
  save(LS.profile,state.profile);localStorage.setItem(LS.onb,'1');
  renderProfile();$('welcome').classList.remove('show');
  toast('✅ '+t('saved'));
}

/* ---------- язык ---------- */
function applyLang(){
  const d=D();
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=d[e.dataset.t]);
  document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=d[e.dataset.p]);
  $('lang-btn').textContent=$('w-lang').textContent=state.lang.toUpperCase();
  $('w-name').placeholder=d.name;$('w-addr').placeholder=d.address;
  $('name-input').placeholder=d.name;$('address-input').placeholder=d.address;
  $('sort-sel').innerHTML=['sortDef','asc','desc','az'].map((k,i)=>{const v=['def','asc','desc','az'][i];return `<option value="${v}" ${sortBy===v?'selected':''}>${d[k]}</option>`}).join('');
  renderProfile();renderBanners();renderCats();renderCatalog();renderHome();updateCartUI();
  if(state.page==='cart')renderCart();
  if(state.page==='favorites')renderFavs();
}
function cycleLang(){const o=['tg','ru','en'];state.lang=o[(o.indexOf(state.lang)+1)%3];localStorage.setItem(LS.lang,state.lang);applyLang()}
function toggleTheme(){state.theme=state.theme==='light'?'dark':'light';localStorage.setItem(LS.theme,state.theme);document.documentElement.setAttribute('data-theme',state.theme);$('theme-switch').checked=state.theme==='dark';$('theme-btn').textContent=state.theme==='dark'?'☀️':'🌙'}

/* ---------- навигация ---------- */
function go(p){
  state.page=p;
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
  $('page-'+p).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===p));
  if(p==='cart')renderCart();
  if(p==='favorites')renderFavs();
  if(p==='home')renderRecent();
  document.querySelector('main').scrollTop=0;
  renderBar();
  if(!fromPop&&!(history.state&&history.state.p===p))history.pushState({p},'');
}

/* ---------- карточки ---------- */
const HEART='<svg fill="FILL" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>';
const imgTag=(p,cls)=>p.img?`<img src="${p.img}" class="${cls}" loading="lazy" alt="" onerror="this.outerHTML='<div class=\\'${cls} emoji\\'>${p.emoji}</div>'">`:`<div class="${cls} emoji">${p.emoji}</div>`;
function renderProducts(cid,items){
  const c=$(cid);
  if(!items.length){c.innerHTML=`<div class="empty-msg">🔍 ${t('none')}</div>`;return}
  c.innerHTML=items.map(p=>{
    const f=state.favs.includes(p.id);
    return `<div class="product-card" onclick="openProduct('${p.id}')">
      ${p.old?`<div class="disc-badge">-${Math.round((1-p.price/p.old)*100)}%</div>`:''}
      <button class="fav-btn ${f?'active':''}" onclick="event.stopPropagation();toggleFav('${p.id}',this)">${HEART.replace('FILL',f?'currentColor':'none')}</button>
      <div class="product-img-container">${imgTag(p,'product-img')}</div>
      <div class="product-price">${p.price} ${CUR}${p.old?`<s>${p.old} ${CUR}</s>`:''}</div>
      <div class="product-name">${p[state.lang]}</div>
      <div class="product-dosage">${p.w}</div>
      <div class="card-act" data-id="${p.id}"></div></div>`}).join('');
  syncCards();
}
function syncCards(){
  document.querySelectorAll('.card-act').forEach(w=>{
    const id=w.dataset.id,q=state.cart[id]||0;
    w.innerHTML=q?`<div class="stepper" onclick="event.stopPropagation()"><button onclick="cardQty('${id}',-1)">−</button><b>${q}</b><button onclick="cardQty('${id}',1)">+</button></div>`
      :`<button class="add-btn" onclick="event.stopPropagation();cardQty('${id}',1)">+ ${t('cart')}</button>`;
  });
}
function cardQty(id,d){d>0?addToCart(id):updateQty(id,-1)}

function renderBanners(){
  const L=state.lang;
  $('banner-slider').innerHTML=BANNERS.map((b,i)=>`<div class="banner ${b.img?'has-img':''}" data-i="${i}" onclick="bannerGo(${i})" ${b.img?`style="background-image:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.05)),url('${b.img}')"`:''}>
    ${b.title[L]?`<h3>${b.title[L]}</h3>`:''}${b.text[L]?`<p>${b.text[L]}</p>`:''}</div>`).join('');
  BANNERS.forEach((b,i)=>{if(!b.img)return;const im=new Image();im.onerror=()=>{const e=document.querySelector(`.banner[data-i="${i}"]`);if(e){e.classList.remove('has-img');e.style.backgroundImage='';}};im.src=b.img});
  $('banner-dots').innerHTML=BANNERS.length>1?BANNERS.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join(''):'';
}
function bannerGo(i){const l=BANNERS[i].link;if(!l)return;l==='catalog'?(state.cat='all',renderCats(),renderCatalog(),go('catalog')):filterCat(l)}
let bannerTimer;
function initBannerSlider(){
  const sl=$('banner-slider');
  sl.addEventListener('scroll',()=>{const i=Math.round(sl.scrollLeft/sl.clientWidth);document.querySelectorAll('#banner-dots i').forEach((d,k)=>d.classList.toggle('on',k===i))});
  clearInterval(bannerTimer);
  bannerTimer=setInterval(()=>{if(state.page!=='home'||BANNERS.length<2)return;const i=(Math.round(sl.scrollLeft/sl.clientWidth)+1)%BANNERS.length;sl.scrollTo({left:i*sl.clientWidth,behavior:'smooth'})},4500);
}
function renderCats(){
  $('home-categories').innerHTML=CATS.filter(c=>c.id!=='all').map(c=>`<div class="category-item" onclick="filterCat('${c.id}')"><div class="category-icon">${c.emoji}</div><span>${c[state.lang]}</span></div>`).join('');
  $('catalog-tabs').innerHTML=CATS.map(c=>`<button class="tab-btn ${state.cat===c.id?'active':''}" onclick="filterCat('${c.id}')">${c[state.lang]}</button>`).join('');
}
function filterCat(id){state.cat=id;renderCats();renderCatalog();if(state.page!=='catalog')go('catalog')}
function renderHome(){
  renderProducts('popular-products',PRODUCTS.slice(0,4));
  const d=PRODUCTS.filter(p=>p.old);
  $('disc-wrap').classList.toggle('hidden',!d.length);
  if(d.length)renderProducts('discount-products',d);
  renderRecent();
}
function renderRecent(){
  const items=load(LS.recent,[]).map(byId).filter(Boolean).slice(0,4),w=$('recent-wrap');
  if(!items.length){w.innerHTML='';return}
  w.innerHTML=`<div class="section-title"><h2>${t('recent')}</h2></div><div class="product-grid" id="recent-grid"></div>`;
  renderProducts('recent-grid',items);
}

/* ---------- каталог и поиск ---------- */
function renderCatalog(){
  let a=PRODUCTS.slice();
  if(state.cat!=='all')a=a.filter(p=>p.cat===state.cat);
  const q=state.q.trim().toLowerCase();
  if(q)a=a.filter(p=>[p.tg,p.ru,p.en].some(s=>s.toLowerCase().includes(q)));
  if(sortBy==='asc')a.sort((x,y)=>x.price-y.price);
  if(sortBy==='desc')a.sort((x,y)=>y.price-x.price);
  if(sortBy==='az')a.sort((x,y)=>x[state.lang].localeCompare(y[state.lang]));
  $('catalog-count').textContent=`${a.length} ${t('found')}`;
  renderProducts('catalog-products',a);
}
function onSearch(v){state.q=v;$('s-clear').style.display=v?'block':'none';if(state.page!=='catalog')go('catalog');renderCatalog()}
function clearSearch(){$('search-input').value='';onSearch('')}

/* ---------- товар ---------- */
function openProduct(id){
  const p=byId(id);if(!p)return;
  save(LS.recent,[id,...load(LS.recent,[]).filter(x=>x!==id)].slice(0,8));
  const f=state.favs.includes(id),catName=CATS.find(c=>c.id===p.cat)[state.lang];
  const rel=PRODUCTS.filter(x=>x.cat===p.cat&&x.id!==id).slice(0,4);
  $('product-detail-content').innerHTML=`
    ${imgTag(p,'detail-img')}
    <div class="detail-title">${p[state.lang]}</div>
    <div class="detail-sub">${p.w} · ${catName}</div>
    <div class="detail-price-row"><div class="detail-price">${p.price} ${CUR}</div>${p.old?`<s>${p.old} ${CUR}</s>`:''}</div>
    <div class="stock-info">✓ ${t('inStock')}</div>
    <div class="detail-actions">
      <div class="card-act" data-id="${id}"></div>
      <button class="icon-btn dfav ${f?'active':''}" onclick="toggleFav('${id}',this)">${HEART.replace('FILL',f?'currentColor':'none')}</button>
      <button class="icon-btn" onclick="shareProduct('${id}')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.7 10.7l6.6-3.4M8.7 13.3l6.6 3.4M18 8a3 3 0 100-6 3 3 0 000 6zM6 15a3 3 0 100-6 3 3 0 000 6zM18 22a3 3 0 100-6 3 3 0 000 6z"/></svg></button>
    </div>
    ${rel.length?`<div class="section-title"><h2>${t('similar')}</h2></div><div class="product-grid" id="rel-grid"></div>`:''}`;
  syncCards();
  if(rel.length)renderProducts('rel-grid',rel);
  go('product');
}
function shareProduct(id){
  const p=byId(id),txt=`${p[state.lang]} — ${p.price} ${CUR}`;
  if(navigator.share)navigator.share({title:'JAIHUN MARKET',text:txt,url:location.href}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(`${txt} ${location.href}`).then(()=>toast('✅ '+t('copied')));
}

/* ---------- корзина ---------- */
function addToCart(id){state.cart[id]=(state.cart[id]||0)+1;save(LS.cart,state.cart);updateCartUI();toast(`✅ ${byId(id)[state.lang]} ${t('added')}`)}
function removeFromCart(id){delete state.cart[id];save(LS.cart,state.cart);updateCartUI();renderCart()}
function updateQty(id,d){const n=(state.cart[id]||0)+d;if(n<=0)return removeFromCart(id);state.cart[id]=n;save(LS.cart,state.cart);updateCartUI();renderCart()}
function clearCart(){state.cart={};save(LS.cart,state.cart);updateCartUI();renderCart()}
function updateCartUI(){
  const c=count();
  [$('cart-badge'),$('nav-badge')].forEach(b=>{b.style.display=c?'flex':'none';b.textContent=c});
  syncCards();renderBar();
}
function renderBar(){
  const c=count(),b=$('cart-bar');
  if(!c||state.page==='cart'){b.style.display='none';return}
  b.style.display='flex';
  b.innerHTML=`<span>🛒 ${t('cart')} · ${c} ${t('pcs')}</span><span>${subtotal()} ${CUR}</span>`;
}
function renderCart(){
  const ids=Object.keys(state.cart).filter(id=>byId(id));
  const empty=!ids.length;
  $('cart-empty').classList.toggle('hidden',!empty);
  $('checkout-section').classList.toggle('hidden',empty);
  $('free-bar').classList.toggle('hidden',empty);
  if(empty){$('cart-items').innerHTML='';return}
  $('cart-items').innerHTML=ids.map(id=>{
    const p=byId(id),q=state.cart[id];
    return `<div class="cart-item">${imgTag(p,'cart-item-img')}<div class="cart-item-info">
      <div class="cart-item-title">${p[state.lang]}</div><div class="cart-item-price">${p.price*q} ${CUR}</div>
      <div class="cart-item-actions"><div class="qty-control"><button class="qty-btn" onclick="updateQty('${id}',-1)">−</button><span class="qty-val">${q}</span><button class="qty-btn" onclick="updateQty('${id}',1)">+</button></div>
      <button class="remove-btn" onclick="removeFromCart('${id}')"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button></div></div></div>`}).join('');
  const s=subtotal(),f=fee(s),left=FREE-s;
  $('sum-sub').textContent=`${s} ${CUR}`;
  $('sum-del').textContent=f?`${f} ${CUR}`:t('free');
  $('sum-total').textContent=`${s+f} ${CUR}`;
  $('free-bar').innerHTML=(left>0?`<div class="fb-t">🚚 ${t('left').replace('{n}',left+' '+CUR)}</div>`:`<div class="fb-t ok">🎉 ${t('freeOk')}</div>`)+`<div class="fb-track"><i style="width:${Math.min(100,s/FREE*100)}%"></i></div>`;
  if(!$('name-input').value)$('name-input').value=state.profile.name||'';
  if(!$('phone-input').value)$('phone-input').value=state.profile.phone||'';
  if(!$('address-input').value)$('address-input').value=state.profile.address||'';
}
function maskPhone(e){
  let d=e.target.value.replace(/\D/g,'');if(d.startsWith('992'))d=d.slice(3);d=d.slice(0,9);
  let o='+992';if(d)o+=' '+d.slice(0,2);if(d.length>2)o+=' '+d.slice(2,5);if(d.length>5)o+=' '+d.slice(5,7);if(d.length>7)o+=' '+d.slice(7,9);
  e.target.value=d?o:'';
}

/* ---------- избранное ---------- */
function toggleFav(id,btn){
  const i=state.favs.indexOf(id);i>-1?state.favs.splice(i,1):state.favs.push(id);
  save(LS.favs,state.favs);
  if(btn){btn.classList.toggle('active',i<0);btn.querySelector('svg').setAttribute('fill',i<0?'currentColor':'none')}
  if(state.page==='favorites')renderFavs();
}
function renderFavs(){
  const a=PRODUCTS.filter(p=>state.favs.includes(p.id));
  $('favorites-empty').classList.toggle('hidden',!!a.length);
  if(a.length)renderProducts('favorites-list',a);else $('favorites-list').innerHTML='';
}

/* ---------- заказ ---------- */
function checkout(method){
  const name=$('name-input').value.trim(),phone=$('phone-input').value.trim(),address=$('address-input').value.trim();
  if(phone.replace(/\D/g,'').length<12){toast('📞 '+t('badPhone'));$('phone-input').focus();return}
  const rows=Object.entries(state.cart).map(([id,q])=>{const p=byId(id);return p&&{n:p[state.lang],q,s:p.price*q}}).filter(Boolean);
  const sub=rows.reduce((a,r)=>a+r.s,0),f=fee(sub),total=sub+f;
  let txt=`🛒 *Супориши нав аз JAIHUN MARKET!*\n\n`;
  if(name)txt+=`👤 Ном: ${name}\n`;
  txt+=`📞 Телефон: ${phone}\n`;
  if(address)txt+=`📍 Суроға: ${address}\n`;
  txt+=`\n📦 *Таркиби фармоиш:*\n`+rows.map(r=>`- ${r.n} (${r.q} шт) = ${r.s} ${CUR}`).join('\n');
  txt+=`\n\n🚚 Интиқол: ${f?f+' '+CUR:'Ройгон'}\n💰 *Ҳамагӣ: ${total} ${CUR}*\n\n_${t('orderMsg')}_`;
  const enc=encodeURIComponent(txt);
  window.open(method==='wa'?`https://wa.me/${WA_PHONE}?text=${enc}`:`https://t.me/share/url?url=${encodeURIComponent('Заказ JAIHUN MARKET')}&text=${enc}`,'_blank');
  save(LS.orders,[{date:new Date().toLocaleString(),rows,total},...load(LS.orders,[])].slice(0,20));
  Object.assign(state.profile,{name:name||state.profile.name,phone,address:address||state.profile.address});
  save(LS.profile,state.profile);renderProfile();
  toast('✅ '+t('sent'));clearCart();
}

/* ---------- профиль ---------- */
function renderProfile(){
  const p=state.profile;
  $('prof-name').textContent=(p.name||t('guest'))+' ✎';
  $('prof-phone').textContent=p.phone||t('noPhone');
  $('avatar-img').style.display=p.avatar?'block':'none';
  $('avatar-letter').style.display=p.avatar?'none':'block';
  if(p.avatar)$('avatar-img').src=p.avatar;else $('avatar-letter').textContent=p.name?p.name[0].toUpperCase():'J';
}
function uploadAvatar(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{state.profile.avatar=ev.target.result;save(LS.profile,state.profile);renderProfile();toast('✅ '+t('saved'))};
  r.readAsDataURL(f);
}
function editField(field){openModal('input',field)}
function clearData(){if(!confirm(t('confirm')))return;localStorage.clear();location.reload()}

/* ---------- модальное окно ---------- */
function openModal(type,field){
  const ok=$('modal-ok'),cancel=$('modal-cancel'),inp=$('modal-input'),text=$('modal-text');
  cancel.textContent=t('cancel');cancel.style.display='block';ok.style.display='none';inp.style.display='none';
  if(type==='orders'){
    $('modal-title').textContent=t('myOrders');
    const o=load(LS.orders,[]);
    text.innerHTML=o.length?o.map(r=>`<div class="order-row"><div style="color:var(--text-muted);font-size:11px">${r.date}</div>${r.rows.map(x=>`${x.n} × ${x.q}`).join(', ')}<div><b>${r.total} ${CUR}</b></div></div>`).join(''):`<div style="padding:20px 0">${t('noOrders')}</div>`;
  }else if(type==='about'){
    $('modal-title').textContent=t('about');text.textContent=t('aboutText');
  }else if(type==='support'){
    $('modal-title').textContent=t('support');
    text.innerHTML=`<div style="font-size:16px;font-weight:700;color:var(--primary);margin:20px 0">${SUPPORT}</div>`;
    ok.style.display='block';ok.textContent=t('call');ok.onclick=()=>{location.href='tel:'+SUPPORT.replace(/\s/g,'')};
  }else if(type==='input'){
    $('modal-title').textContent=field==='name'?t('newName'):t('newAddr');text.textContent='';
    inp.style.display='block';inp.value=state.profile[field]||'';
    ok.style.display='block';ok.textContent=t('save');
    ok.onclick=()=>{state.profile[field]=inp.value.trim();save(LS.profile,state.profile);renderProfile();closeModal();toast('✅ '+t('saved'))};
    setTimeout(()=>inp.focus(),100);
  }
  $('custom-modal').classList.add('active');
}
function closeModal(){$('custom-modal').classList.remove('active')}

let toastT;
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2200)}
</script>
</body>
</html>
